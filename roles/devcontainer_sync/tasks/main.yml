---
- name: Validate devcontainer list
  ansible.builtin.assert:
    that:
      - devcontainers is sequence
      - devcontainers is not string
    fail_msg: devcontainers must be a list.

- name: Validate devcontainer identities
  ansible.builtin.assert:
    that:
      - devcontainer_config is mapping
      - devcontainer_config.name is defined
      - devcontainer_config.name is string
      - devcontainer_config.name | trim | length > 0
      - not (devcontainer_config.name is match('^/'))
      - not (devcontainer_config.name is search('(^|/)\\.\\.(/|$)'))
      - devcontainer_config.path is not defined or devcontainer_config.path is string
      - devcontainer_config.path is not defined or devcontainer_config.path | trim | length > 0
      - devcontainer_config.path is not defined or not (devcontainer_config.path is match('^/'))
      - devcontainer_config.path is not defined or not (devcontainer_config.path is search('(^|/)\\.\\.(/|$)'))
    fail_msg: >-
      Each devcontainer must have a nonempty, relative name and an optional
      nonempty, relative path. Parent-directory traversal is not allowed.
  loop: "{{ devcontainers }}"
  loop_control:
    label: "{{ devcontainer_config.name | default('unnamed') }}"
    loop_var: devcontainer_config

- name: Validate unique devcontainer names
  ansible.builtin.assert:
    that:
      - devcontainers | map(attribute='name') | list | length == devcontainers | map(attribute='name') | unique | list | length
    fail_msg: Devcontainer names must be unique because names identify entries under files/.

- name: Sync devcontainer
  ansible.builtin.include_tasks: sync_devcontainer.yml
  loop: "{{ devcontainers }}"
  loop_control:
    label: "{{ devcontainer_config.name }}"
    loop_var: devcontainer_config
